name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build image
        run: docker build -t localhost/portfolio:local .

      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --user 65532:65532 \
            localhost/portfolio:local -t

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD/kubernetes:/manifests:ro" \
            ghcr.io/yannh/kubeconform:latest -strict -summary /manifests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio
        run: |
          docker tag localhost/portfolio:local "$IMAGE:latest"
          docker tag localhost/portfolio:local "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
